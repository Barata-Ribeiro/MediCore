packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64
minimumReleaseAgeExclude:
    - '@rollup/rollup-linux-x64-gnu@4.63.1 || 4.63.3'
    - '@rollup/rollup-win32-x64-msvc@4.63.1 || 4.63.3'
    - '@vitejs/plugin-react@6.1.1'
    - lucide-react@1.35.0 || 1.38.0 || 1.40.0 || 1.42.0 || 1.48.0
    - '@shadcn/react@0.3.1'
    - shadcn@4.19.1 || 4.20.1
    - '@types/react-dom@19.2.7'
    - '@types/node@26.5.0'
    - tailwind-merge@3.7.0
    - '@tanstack/hotkeys@0.9.0'
    - '@tanstack/react-hotkeys@0.11.0'
    - cn@0.3.2 || 0.4.0
    - react-resizable-panels@4.13.2 || 4.13.3
    - '@laravel/multiplex@0.4.4'
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vite-plus: 0.3.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
