packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - '@rollup/rollup-linux-x64-gnu@4.64.9'
    - '@rollup/rollup-win32-x64-msvc@4.64.9'
    - '@vitejs/plugin-react@6.1.2'
    - '@shadcn/react@0.3.1'
    - '@types/node@26.6.5'
    - '@tanstack/hotkeys@0.16.0'
    - '@tanstack/react-hotkeys@0.15.0'
    - cn@0.4.0
    - '@laravel/multiplex@0.4.5'
    - '@inertiajs/core@3.9.1'
    - '@inertiajs/react@3.9.1'
    - '@inertiajs/vite@3.9.1'
    - '@types/lodash@4.17.26'
minimumReleaseAgeExcludePrune: true

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.2.0
    vitest: 5.0.4
    vite-plus: 1.2.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
