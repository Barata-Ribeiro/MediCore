packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vitest: 5.1.0
    vite-plus: 1.6.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
    - '@tailwindcss/node@4.3.5'
    - '@tailwindcss/oxide-android-arm64@4.3.5'
    - '@tailwindcss/oxide-darwin-arm64@4.3.5'
    - '@tailwindcss/oxide-darwin-x64@4.3.5'
    - '@tailwindcss/oxide-freebsd-x64@4.3.5'
    - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5'
    - '@tailwindcss/oxide-linux-arm64-gnu@4.3.5'
    - '@tailwindcss/oxide-linux-arm64-musl@4.3.5'
    - '@tailwindcss/oxide-linux-x64-gnu@4.3.5'
    - '@tailwindcss/oxide-linux-x64-musl@4.3.5'
    - '@tailwindcss/oxide-wasm32-wasi@4.3.5'
    - '@tailwindcss/oxide-win32-arm64-msvc@4.3.5'
    - '@tailwindcss/oxide-win32-x64-msvc@4.3.5'
    - '@tailwindcss/oxide@4.3.5'
    - '@tailwindcss/vite@4.3.5'
    - tailwindcss@4.3.5
    - '@babel/core@8.1.2'
    - '@babel/generator@8.1.2'
    - '@babel/helper-string-parser@8.1.2'
    - '@babel/helpers@8.1.2'
    - '@babel/parser@8.1.2'
    - '@babel/template@8.1.2'
    - '@babel/traverse@8.1.2'
    - '@babel/types@8.1.2'
    - '@rollup/rollup-linux-x64-gnu@4.68.6'
    - '@rollup/rollup-win32-x64-msvc@4.68.6'
    - lucide-react@1.75.0
    - recharts@3.11.0
