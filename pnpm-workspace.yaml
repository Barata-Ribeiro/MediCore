packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
overrides:
    vite@*: 'catalog:'

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
    - '@babel/core@8.1.4'
    - '@babel/generator@8.1.4'
    - '@babel/helpers@8.1.4'
    - '@babel/traverse@8.1.4'
    - '@rolldown/plugin-babel@0.3.2'
    - '@rollup/rollup-linux-x64-gnu@4.68.9'
    - '@rollup/rollup-win32-x64-msvc@4.68.9'
    - '@tanstack/hotkeys@0.38.0'
    - '@tanstack/react-hotkeys@0.29.0'
    - '@types/lodash@4.17.28'
    - lucide-react@1.83.0
    - react-resizable-panels@4.26.0
    - recharts@3.11.2
