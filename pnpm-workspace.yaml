packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - '@vitejs/plugin-react@6.1.2'
    - '@shadcn/react@0.3.1'
    - cn@0.4.0
    - '@laravel/multiplex@0.4.5'
    - '@inertiajs/core@3.9.1'
    - '@inertiajs/react@3.9.1'
    - '@inertiajs/vite@3.9.1'
minimumReleaseAgeExcludePrune: true

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vitest: 5.0.5
    vite-plus: 1.4.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'