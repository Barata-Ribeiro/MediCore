packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64
minimumReleaseAgeExclude:
    - '@rollup/rollup-linux-x64-gnu@4.63.1 || 4.63.3'
    - '@rollup/rollup-win32-x64-msvc@4.63.1 || 4.63.3'
    - '@vitejs/plugin-react@6.1.1'
    - lucide-react@1.35.0 || 1.38.0 || 1.40.0 || 1.42.0 || 1.48.0
    - '@shadcn/react@0.3.1'
    - shadcn@4.19.1 || 4.20.1 || 4.21.1
    - '@types/react-dom@19.2.7'
    - '@types/node@26.5.0 || 26.6.4'
    - tailwind-merge@3.7.0
    - '@tanstack/hotkeys@0.9.0 || 0.10.1'
    - '@tanstack/react-hotkeys@0.11.0 || 0.12.1'
    - cn@0.3.2 || 0.4.0
    - react-resizable-panels@4.13.2 || 4.13.3
    - '@laravel/multiplex@0.4.4 || 0.4.5'
    - '@voidzero-dev/vite-plus-core@1.0.0'
    - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
    - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
    - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
    - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
    - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
    - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
    - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
    - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
    - vite-plus@1.0.0
    - '@inertiajs/core@3.8.0'
    - '@inertiajs/react@3.8.0'
    - '@inertiajs/vite@3.8.0'
    - '@shadcn/registry@0.1.0'
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vitest: 5.0.2
    vite-plus: 1.0.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
